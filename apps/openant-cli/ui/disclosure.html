<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Name}} — Knostic OpenAnt</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; }
  header { background: #0d1117; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
  header a { color: #8b949e; text-decoration: none; font-size: 0.85rem; }
  header a:hover { color: #fff; }
  header .sep { color: #8b949e; }
  header .title { color: #fff; font-size: 0.9rem; font-weight: 600; }
  .main { max-width: 820px; margin: 32px auto; padding: 0 24px 48px; }
  .content {
    background: #fff; border: 1px solid #e1e4e8; border-radius: 8px;
    padding: 32px 40px; line-height: 1.7;
  }
  .content h1 { font-size: 1.6rem; margin-bottom: 16px; }
  .content h2 { font-size: 1.2rem; margin: 24px 0 10px; border-bottom: 1px solid #e1e4e8; padding-bottom: 6px; }
  .content h3 { font-size: 1rem; margin: 18px 0 8px; }
  .content h4 { font-size: 0.95rem; margin: 14px 0 6px; color: #444; }
  .content p  { margin-bottom: 12px; color: #333; }
  .content ul, .content ol { margin: 8px 0 12px 20px; }
  .content li { margin-bottom: 4px; }
  .content code { font-family: "SF Mono", "Fira Code", monospace; background: #f3f3f3; padding: 1px 5px; border-radius: 3px; font-size: 0.88em; }
  .content pre { background: #0d1117; color: #e6edf3; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 14px 0; }
  .content pre code { background: none; padding: 0; color: inherit; font-size: 0.83em; }
  .content blockquote { border-left: 3px solid #d0d7de; padding-left: 14px; color: #666; margin: 12px 0; }
  .content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9rem; }
  .content th, .content td { padding: 8px 12px; border: 1px solid #e1e4e8; text-align: left; }
  .content th { background: #f8f8f8; font-weight: 600; }
  .content hr { border: none; border-top: 1px solid #e1e4e8; margin: 24px 0; }
  .content a { color: #0969da; }
  .content a:hover { text-decoration: underline; }
  /* Severity badge colors for common disclosure headers */
  .content h2:first-of-type { color: #cf222e; }
</style>
</head>
<body>
<header>
  <a href="/">← Home</a>
  <span class="sep">/</span>
  <a href="/scan/{{.ID}}">Scan</a>
  <span class="sep">/</span>
  <span class="title">{{.Name}}</span>
</header>
<div class="main">
  <div class="content" id="content">
    <span style="color:#888;font-size:0.9rem">Loading…</span>
  </div>
</div>
<script src="/assets/marked.min.js"></script>
<script src="/assets/purify.min.js"></script>
<script>
// Strict INERT allowlist for markdown rendered from an untrusted scanned repo.
// The disclosure markdown embeds attacker-controlled source in a code fence the
// repo can break out of; DOMPurify's DEFAULT config still permits style/form/
// input/img/svg, which allow beacon requests, CSS defacement, and same-origin
// phishing forms even though scripts are stripped. Restrict to inert formatting.
const MD_SANITIZE = {
  ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','blockquote',
    'ul','ol','li','pre','code','em','strong','del','a','span','div',
    'table','thead','tbody','tr','th','td','sup','sub','kbd'],
  ALLOWED_ATTR: ['href','title','class','align','colspan','rowspan','target','rel'],
  FORBID_TAGS: ['style','form','input','button','textarea','select','option',
    'img','picture','source','svg','math','iframe','object','embed','link','base','meta'],
  FORBID_ATTR: ['style','src','srcset','action','formaction','background','poster','loading'],
  ALLOW_DATA_ATTR: false
};
const markdown = {{.MarkdownJSON}};
document.getElementById('content').innerHTML = DOMPurify.sanitize(marked.parse(markdown), MD_SANITIZE);

// Make repository URLs in the rendered output clickable links. The result is
// re-sanitized with the same inert allowlist: rewriting innerHTML can reintroduce
// markup, and the URL class excludes quotes/angle-brackets so a crafted URL
// cannot break out of the href attribute.
document.querySelectorAll('#content p, #content li').forEach(el => {
  el.innerHTML = DOMPurify.sanitize(el.innerHTML.replace(
    /(\*\*Repository:\*\*\s*)(https?:\/\/[^\s<>"']+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>'
  ), MD_SANITIZE);
});
</script>
</body>
</html>
