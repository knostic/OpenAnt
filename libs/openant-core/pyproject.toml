[project]
name = "openant"
version = "0.1.0"
description = "Two-stage SAST tool using Claude for vulnerability analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The ``[bedrock]`` extra pulls boto3, which ``anthropic.AnthropicBedrock``
    # needs to resolve AWS credentials and SigV4-sign requests (the Bedrock
    # adapter constructs fine without it, but a real call fails without boto3).
    "anthropic[bedrock]>=0.40.0",
    # openai adapter uses the Responses API (``client.responses.create`` with
    # ``reasoning``/``max_output_tokens``/``store``) for the gpt-5+ path AND
    # ``max_completion_tokens`` for o-series on Chat Completions. Both are 2.x
    # SDK surface; pin the floor to a version that ships a stable Responses API.
    "openai>=2.2.0",
    # google adapter uses keyword-only ``Part.from_text(text=...)`` and
    # ``HttpOptions(base_url=...)``, both stabilised in google-genai 1.0.0.
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-php>=0.22.0",
    "tree-sitter-zig>=1.1.2",
    "tree-sitter-swift>=0.7.3",
    "tree-sitter-rust>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
openant = "openant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Bug-catching rules apply everywhere; the style/dead-code rules (F401
# unused-import, F841 unused-local) cover the WHOLE repo now — the prod
# residue (92 findings: the refactor leftovers in the c/php/ruby/python
# parser import blocks + the core/utilities refactor residue, re-export-
# adjudicated with 0 cross-file traps) was cleaned in the same commit the
# scope expanded (the #481 prod half — the #483 test half preceded it).
# SIM115 (open-without-with) flags unmanaged open-family calls EXCEPT in
# return statements, behind ExitStack/enterContext, immediately .close()d,
# or inside __enter__ — the return shape and Name/BinOp ``.open`` receivers
# are its blind spot; the tests-tree conformance scan in
# tests/test_issue481_bare_open_conformance.py closes those.
select = ["F821", "F811", "F823", "F401", "F841", "SIM115"]

[tool.ruff.lint.per-file-ignores]
# NOTE: the SIM115 entries below are also consumed (via fnmatch) by the
# AST conformance sweep in tests/test_issue481_bare_open_conformance.py —
# keep slash-containing path forms; a basename-only pattern matches for
# ruff (basename) but not the sweep (full relative path).
# The efficacy fixtures are BENCHMARK DATA — the oracle scores them; style
# rules never touch them (a deliberate bare open lives at
# tests/efficacy/fixtures/webapp/src/app_a.py:15 and must stay).
"tests/efficacy/fixtures/**" = ["F401", "F841", "SIM115"]
# The sample repos are parser INPUT DATA — arbitrary target-repo code the
# language parsers consume, not this project's own test logic.
"tests/fixtures/**" = ["SIM115"]

[tool.hatch.build.targets.wheel]
packages = [
    "openant",
    "core",
    "utilities",
    "parsers",
    "prompts",
    "context",
    "report",
]

# Keep test scaffolding and generated outputs out of the distribution. These are
# regenerable artifacts, not product: report/test_output shipped a third-party
# exploit writeup (paperless-ngx, CWE-639) and a stale sample report, and
# report/test_data shipped a captured pipeline. None is referenced by production.
exclude = [
    "**/test_output",
    "**/test_data",
    "**/test_output/**",
    "**/test_data/**",
]

# config/languages.json is the single source of truth for the language set, read
# by BOTH the Python engine and the Go CLI. It lives at the monorepo root, two
# levels above this project root, so `packages` above cannot reach it and the
# wheel shipped without it: the registry then resolved to {} and every language
# silently disappeared (`-l python` became "invalid choice", detection found zero
# files in any repository). force-include is what makes an installed layout work,
# and it must land at `config/` so the upward search from the installed package
# finds it the same way it does in a checkout.
[tool.hatch.build.targets.wheel.force-include]
"../../config/languages.json" = "config/languages.json"
# config/models.json is the shared provider-model registry (IDs, status,
# pricing), read by both runtimes exactly like languages.json. Without this
# stanza it would not ship in the wheel and core/model_registry.require_models()
# would fail loud — the same defect class that made every language vanish.
"../../config/models.json" = "config/models.json"
